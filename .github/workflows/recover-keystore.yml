name: Recover Android Keystore

# Temporary one-shot workflow to re-materialize signing materials from
# GitHub Secrets onto a short-lived private artifact. Delete this file
# after downloading the artifact.
on:
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Materialize signing materials
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "ANDROID_KEYSTORE secret is empty" >&2
            exit 1
          fi
          # Match existing CI: secret holds base64 of the .jks file
          printf '%s' "$KEYSTORE_B64" | base64 -d > my-release-key.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=my-release-key.jks"
          } > key.properties
          # Validate without printing secrets
          keytool -list -keystore my-release-key.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Keystore decoded and validated successfully."

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-recovery
          path: |
            my-release-key.jks
            key.properties
          retention-days: 1
